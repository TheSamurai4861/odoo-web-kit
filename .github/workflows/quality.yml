name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repository and addon sources
        run: python scripts/verify-portable.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find scripts website_webkit -type f \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -r -n1 node --check

  odoo-install:
    needs: portable-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webkit_ci
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d webkit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out addon
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out tested Odoo 19 revision
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: c2a39085ba0fbcf8a0e6a55228191e764499caea
          path: .odoo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .odoo/requirements.txt

      - name: Install Odoo system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libldap2-dev libpq-dev libsasl2-dev

      - name: Install Odoo Python dependencies
        run: python -m pip install --requirement .odoo/requirements.txt

      - name: Install addon in a fresh database
        run: |
          python .odoo/odoo-bin \
            --addons-path="$PWD/.odoo/odoo/addons,$PWD/.odoo/addons,$PWD" \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --database=webkit_ci \
            --init=website_webkit \
            --without-demo=all \
            --stop-after-init

      - name: Verify installed views and Builder registry
        run: |
          python .odoo/odoo-bin shell \
            --addons-path="$PWD/.odoo/odoo/addons,$PWD/.odoo/addons,$PWD" \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --database=webkit_ci \
            --no-http \
            < scripts/verify-ci-odoo.py
